<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Nesbitt Codex — Interactive Research Intelligence Platform</title>
<style>
:root{
  --bg:#070a10; --bg2:#0b1017; --panel:#111823; --panel2:#161f2d; --panel3:#1c2736;
  --line:#22303f; --line2:#2e3f52;
  --tx:#e6edf5; --tx2:#a8b8ca; --tx3:#6f8299;
  --ir:#ff9e3d;      /* infrared / spectroscopy */
  --dyn:#4ddbc4;     /* dynamics / interfaces */
  --nano:#a98bff;    /* nanoscience */
  --bio:#ff6b9d;     /* biophysics */
  --inst:#56b8ff;    /* instrumentation */
  --theory:#ffd84d;  /* theory */
  --you:#7CFF8F;     /* your-fit accent */
  --rad:14px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;background:
    radial-gradient(1200px 700px at 78% -8%,rgba(169,139,255,.11),transparent 60%),
    radial-gradient(1000px 600px at 5% 8%,rgba(86,184,255,.09),transparent 60%),
    radial-gradient(900px 600px at 50% 110%,rgba(255,158,61,.07),transparent 60%),
    var(--bg);
  color:var(--tx);font-family:var(--sans);font-size:15.5px;line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--inst);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:rgba(77,219,196,.3)}

/* ============ LAYOUT ============ */
.shell{display:flex;min-height:100vh}
aside{
  width:268px;flex:0 0 268px;background:rgba(9,13,20,.9);
  border-right:1px solid var(--line);position:sticky;top:0;height:100vh;
  overflow-y:auto;backdrop-filter:blur(14px);z-index:40;
}
aside::-webkit-scrollbar,main::-webkit-scrollbar,.scrollbox::-webkit-scrollbar{width:9px;height:9px}
aside::-webkit-scrollbar-thumb,main::-webkit-scrollbar-thumb,.scrollbox::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.brand .spectrum{height:4px;border-radius:4px;background:linear-gradient(90deg,#a98bff,#56b8ff,#4ddbc4,#ffd84d,#ff9e3d,#ff6b9d);margin-bottom:13px}
.brand h1{font-size:17px;margin:0;letter-spacing:-.4px;font-weight:700}
.brand p{margin:4px 0 0;font-size:11.5px;color:var(--tx3);font-family:var(--mono);letter-spacing:.2px}
nav{padding:12px 10px 40px}
.navgroup{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--tx3);
  padding:16px 12px 7px;font-weight:700}
.navlink{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;
  color:var(--tx2);font-size:13.6px;cursor:pointer;border:1px solid transparent;transition:.14s}
.navlink:hover{background:var(--panel2);color:var(--tx)}
.navlink.on{background:linear-gradient(90deg,rgba(86,184,255,.17),rgba(86,184,255,.03));
  color:#fff;border-color:rgba(86,184,255,.3)}
.navlink .ic{width:19px;text-align:center;font-size:14px;opacity:.9}
.navlink .n{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--tx3);
  background:var(--panel3);padding:1px 6px;border-radius:20px}

main{flex:1;min-width:0;max-height:100vh;overflow-y:auto;scroll-behavior:smooth}
.wrap{max-width:1180px;margin:0 auto;padding:30px 34px 120px}
.topbar{position:sticky;top:0;z-index:30;background:rgba(7,10,16,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:11px 34px;display:flex;align-items:center;gap:14px}
.searchbox{flex:1;max-width:520px;position:relative}
.searchbox input{width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--tx);
  padding:9px 13px 9px 36px;border-radius:10px;font-size:13.5px;font-family:var(--sans);outline:none}
.searchbox input:focus{border-color:var(--inst);box-shadow:0 0 0 3px rgba(86,184,255,.13)}
.searchbox .mag{position:absolute;left:12px;top:9px;color:var(--tx3);font-size:13px}
.results{position:absolute;top:46px;left:0;right:0;background:var(--panel);border:1px solid var(--line2);
  border-radius:12px;max-height:440px;overflow-y:auto;display:none;box-shadow:0 22px 60px rgba(0,0,0,.6);z-index:60}
.results.on{display:block}
.rhit{padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.rhit:hover{background:var(--panel2)}
.rhit b{font-size:13.5px;display:block}
.rhit span{font-size:11.6px;color:var(--tx3)}
.rhit .tag{font-family:var(--mono);font-size:9.5px;padding:1px 6px;border-radius:4px;
  background:var(--panel3);color:var(--tx2);margin-right:6px;text-transform:uppercase}
.menubtn{display:none;background:var(--panel);border:1px solid var(--line2);color:var(--tx);
  border-radius:9px;width:38px;height:36px;font-size:17px;cursor:pointer}

/* ============ PRIMITIVES ============ */
.page{display:none;animation:fade .28s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
h2.ph{font-size:30px;letter-spacing:-.9px;margin:6px 0 4px;font-weight:750;line-height:1.16}
p.psub{color:var(--tx2);font-size:15px;margin:0 0 26px;max-width:78ch}
h3{font-size:19px;letter-spacing:-.3px;margin:34px 0 12px;font-weight:700}
h4{font-size:15px;margin:22px 0 9px;font-weight:700;color:var(--tx)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--tx3);margin-bottom:9px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:20px}
.card.pad0{padding:0;overflow:hidden}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;
  padding:3px 9px;border-radius:30px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx2);
  text-transform:uppercase;letter-spacing:.6px}
.chip.ir{color:var(--ir);border-color:rgba(255,158,61,.38);background:rgba(255,158,61,.09)}
.chip.dyn{color:var(--dyn);border-color:rgba(77,219,196,.38);background:rgba(77,219,196,.09)}
.chip.nano{color:var(--nano);border-color:rgba(169,139,255,.38);background:rgba(169,139,255,.09)}
.chip.bio{color:var(--bio);border-color:rgba(255,107,157,.38);background:rgba(255,107,157,.09)}
.chip.inst{color:var(--inst);border-color:rgba(86,184,255,.38);background:rgba(86,184,255,.09)}
.chip.theory{color:var(--theory);border-color:rgba(255,216,77,.38);background:rgba(255,216,77,.09)}
.chip.you{color:var(--you);border-color:rgba(124,255,143,.38);background:rgba(124,255,143,.09)}
.btn{background:var(--panel2);border:1px solid var(--line2);color:var(--tx);padding:7px 13px;
  border-radius:9px;font-size:12.6px;cursor:pointer;font-family:var(--sans);transition:.14s}
.btn:hover{background:var(--panel3);border-color:var(--inst)}
.btn.on{background:rgba(86,184,255,.18);border-color:var(--inst);color:#fff}
.btnrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:0}
.kv span:first-child{color:var(--tx3);font-size:13px}
.kv span:last-child{text-align:right;font-size:13.4px;font-weight:600}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:16px 17px}
.stat .v{font-size:27px;font-weight:750;letter-spacing:-1px;font-family:var(--mono);line-height:1.1}
.stat .l{font-size:11.4px;color:var(--tx3);text-transform:uppercase;letter-spacing:.9px;margin-top:5px}
.note{border-left:3px solid var(--inst);background:rgba(86,184,255,.07);padding:12px 15px;
  border-radius:0 10px 10px 0;font-size:13.8px;color:var(--tx2);margin:14px 0}
.note.warn{border-color:var(--ir);background:rgba(255,158,61,.08)}
.note.good{border-color:var(--you);background:rgba(124,255,143,.07)}
.note b{color:var(--tx)}
ul.tight{margin:9px 0;padding-left:20px}
ul.tight li{margin-bottom:6px;font-size:14.2px;color:var(--tx2)}
ul.tight li b,ul.tight li strong{color:var(--tx)}
.mono{font-family:var(--mono)}
.tx3{color:var(--tx3)}
.clickterm{border-bottom:1px dotted var(--inst);cursor:pointer;color:var(--inst)}
.clickterm:hover{background:rgba(86,184,255,.12)}

/* ============ ACCORDION ============ */
.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--panel);overflow:hidden}
.acc>.hd{padding:14px 17px;cursor:pointer;display:flex;align-items:center;gap:11px;font-weight:650;font-size:14.6px}
.acc>.hd:hover{background:var(--panel2)}
.acc>.hd .caret{margin-left:auto;color:var(--tx3);transition:.2s;font-size:12px}
.acc.open>.hd .caret{transform:rotate(90deg)}
.acc>.bd{display:none;padding:2px 17px 18px;border-top:1px solid var(--line)}
.acc.open>.bd{display:block}

/* ============ TABLES ============ */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13.2px;min-width:620px}
th{background:var(--panel2);text-align:left;padding:10px 13px;font-size:10.6px;text-transform:uppercase;
  letter-spacing:1px;color:var(--tx3);border-bottom:1px solid var(--line2);position:sticky;top:0;cursor:pointer;white-space:nowrap}
th:hover{color:var(--tx)}
td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--tx2)}
tr:hover td{background:rgba(86,184,255,.045)}
td b{color:var(--tx)}

/* ============ CONCEPT MAP ============ */
.mapbox{position:relative;border:1px solid var(--line);border-radius:14px;background:
  radial-gradient(900px 500px at 50% 40%,rgba(86,184,255,.05),transparent 70%),var(--bg2);overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto;cursor:grab}
.nodeg{cursor:pointer}
.nodeg circle{transition:.18s}
.nodeg:hover circle{stroke-width:3}
.nodeg text{font-size:9.6px;fill:var(--tx2);pointer-events:none;font-family:var(--sans);font-weight:600}
.nodeg.dim{opacity:.17}
.edge{stroke:var(--line2);stroke-width:1.1;opacity:.5;transition:.18s}
.edge.hot{stroke:var(--inst);stroke-width:2.1;opacity:1}
.edge.dim{opacity:.05}
.maplegend{display:flex;flex-wrap:wrap;gap:12px;padding:12px 16px;border-top:1px solid var(--line);
  background:var(--panel);font-size:11.5px;color:var(--tx2)}
.maplegend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}
#mapdetail{padding:16px;border-top:1px solid var(--line);background:var(--panel);min-height:92px;font-size:13.6px;color:var(--tx2)}
#mapdetail h5{margin:0 0 7px;font-size:15px;color:var(--tx)}

/* ============ MODAL ============ */
.modal{position:fixed;inset:0;background:rgba(3,6,11,.82);backdrop-filter:blur(7px);z-index:100;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .inner{background:var(--panel);border:1px solid var(--line2);border-radius:16px;max-width:680px;
  width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 30px 90px rgba(0,0,0,.7)}
.modal .mh{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.modal .mh h3{margin:0;font-size:21px;letter-spacing:-.4px}
.modal .mb{padding:18px 22px 26px}
.modal .x{margin-left:auto;background:var(--panel2);border:1px solid var(--line2);color:var(--tx2);
  width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;flex:0 0 auto}
.layer{margin-bottom:16px}
.layer .lh{font-family:var(--mono);font-size:10px;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--tx3);margin-bottom:5px;display:flex;align-items:center;gap:7px}
.layer .lh:before{content:'';width:16px;height:2px;background:var(--inst);border-radius:2px}
.layer p{margin:0;font-size:14.3px;color:var(--tx2)}
.layer.formal .lh:before{background:var(--theory)}
.layer.why .lh:before{background:var(--you)}
.layer.analogy .lh:before{background:var(--nano)}

/* ============ TIMELINE ============ */
.tl{position:relative;padding-left:30px}
.tl:before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg,#a98bff,#56b8ff,#4ddbc4,#ffd84d,#ff9e3d)}
.tlitem{position:relative;margin-bottom:17px}
.tlitem:before{content:'';position:absolute;left:-26px;top:7px;width:10px;height:10px;border-radius:50%;
  background:var(--bg);border:2px solid var(--inst)}
.tlitem .yr{font-family:var(--mono);font-size:11.5px;color:var(--ir);font-weight:700}
.tlitem .ti{font-size:14.4px;font-weight:620}
.tlitem .td{font-size:13.2px;color:var(--tx3)}

/* ============ BARS ============ */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12.8px}
.bar .lbl{flex:0 0 165px;color:var(--tx2);text-align:right;font-size:12.4px}
.bar .track{flex:1;height:18px;background:var(--panel2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#56b8ff,#4ddbc4)}
.bar .num{flex:0 0 36px;font-family:var(--mono);font-size:11.5px;color:var(--tx3)}

/* ============ CHECKLIST ============ */
.chk{display:flex;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  margin-bottom:8px;background:var(--panel);cursor:pointer;transition:.14s}
.chk:hover{border-color:var(--line2);background:var(--panel2)}
.chk.done{border-color:rgba(124,255,143,.4);background:rgba(124,255,143,.055)}
.chk .box{flex:0 0 19px;height:19px;border:2px solid var(--line2);border-radius:5px;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--you)}
.chk.done .box{border-color:var(--you)}
.chk .t{font-size:14px;font-weight:600}
.chk .d{font-size:12.6px;color:var(--tx3)}
.chk.done .t{text-decoration:line-through;color:var(--tx3)}
.prog{height:7px;background:var(--panel2);border-radius:7px;overflow:hidden;border:1px solid var(--line);margin:8px 0 20px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--you),#4ddbc4);width:0;transition:.4s}

/* ============ Q&A ============ */
.qa{border:1px solid var(--line);border-left:3px solid var(--ir);border-radius:0 12px 12px 0;
  margin-bottom:11px;background:var(--panel)}
.qa .q{padding:14px 17px;cursor:pointer;font-size:14.6px;font-weight:640;display:flex;gap:11px}
.qa .q .qn{font-family:var(--mono);color:var(--ir);flex:0 0 auto;font-size:13px}
.qa .a{display:none;padding:0 17px 17px 45px;font-size:14px;color:var(--tx2);border-top:1px solid var(--line);padding-top:13px}
.qa.open .a{display:block}
.qa .a .say{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-top:10px}
.qa .a .say:before{content:'SAY THIS';font-family:var(--mono);font-size:9.5px;letter-spacing:1.3px;
  color:var(--you);display:block;margin-bottom:6px}

/* ============ PITCH ============ */
.pitch{background:linear-gradient(135deg,rgba(124,255,143,.09),rgba(86,184,255,.06));
  border:1px solid rgba(124,255,143,.3);border-radius:14px;padding:20px 22px;font-size:15px;line-height:1.72}
.pitch .ln{margin-bottom:11px}
.pitch .ln b{color:var(--you)}
.copybtn{background:rgba(124,255,143,.13);border:1px solid rgba(124,255,143,.4);color:var(--you);
  padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:var(--mono)}

/* ============ PILLAR CARDS ============ */
.pillar{border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;background:var(--panel)}
.pillar .ph2{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.pillar .ph2 .num{font-family:var(--mono);font-size:25px;font-weight:750;opacity:.32;line-height:1}
.pillar .ph2 h4{margin:0;font-size:16px;letter-spacing:-.2px}
.pillar .ph2 p{margin:3px 0 0;font-size:12.6px;color:var(--tx3)}
.pillar .pbody{padding:16px 18px}
.pillar.ir{border-top:3px solid var(--ir)} .pillar.ir .num{color:var(--ir)}
.pillar.dyn{border-top:3px solid var(--dyn)} .pillar.dyn .num{color:var(--dyn)}
.pillar.nano{border-top:3px solid var(--nano)} .pillar.nano .num{color:var(--nano)}
.pillar.bio{border-top:3px solid var(--bio)} .pillar.bio .num{color:var(--bio)}

.hero{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:
  linear-gradient(135deg,rgba(169,139,255,.1),rgba(86,184,255,.05) 40%,rgba(255,158,61,.06));
  padding:30px 32px;margin-bottom:22px;position:relative}
.hero .spec{position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,#a98bff,#56b8ff,#4ddbc4,#ffd84d,#ff9e3d,#ff6b9d)}
.hero h2{font-size:34px;letter-spacing:-1.2px;margin:0 0 8px;font-weight:780;line-height:1.1}
.hero p{margin:0;max-width:76ch;color:var(--tx2);font-size:15.5px}

.srcnote{font-size:11.8px;color:var(--tx3);font-family:var(--mono);margin-top:10px;line-height:1.6}
.scrollbox{max-height:520px;overflow-y:auto}

@media(max-width:1020px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:860px){
  aside{position:fixed;left:-280px;transition:.26s;box-shadow:0 0 60px rgba(0,0,0,.6)}
  aside.open{left:0}
  .menubtn{display:block}
  .wrap{padding:22px 17px 110px}
  .topbar{padding:10px 17px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .hero{padding:22px 19px}.hero h2{font-size:26px}
  h2.ph{font-size:24px}
  .bar .lbl{flex:0 0 108px;font-size:11.4px}
  .qa .a{padding-left:17px}
  #clock{display:none}
  .searchbox{max-width:none}
}
</style>
</head>
<body>
